# Имена сервисов совпадают с контейнерами на диаграмме C42 (ЛР №2).
# Сети: front – только web<->api; data – всё остальное. web не видит БД/Redis/брокер:
# это внутренняя граница доверия (между публичным периметром и контуром данных).
name: support-system

x-env-file: &env_file
  env_file: .env

services:
  # ---------- Реляционная база данных ----------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_API_PASSWORD: ${DB_API_PASSWORD}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # выполняются один раз, при первом запуске на пустом томе, по алфавиту
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
      - ./db/roles.sql:/sql/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  # ---------- Redis: сессии, лимиты, идемпотентность, коды сброса ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  # ---------- Брокер сообщений ----------
  broker:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.template.json:/etc/rabbitmq/definitions.template.json:ro
      - ./rabbitmq/entrypoint.sh:/entrypoint.sh:ro
      - broker-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"   # веб-консоль (только для демонстрации)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [data]

  # ---------- Объектное хранилище документов (S3 API) ----------
  # RustFS вместо MinIO: образы MinIO больше не публикуются в публичных реестрах
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - storage-data:/data
    networks: [data]

  # Одноразово: создаёт бакет documents
  storage-init:
    build: ./api
    command: ["python", "-m", "app.storage_init"]
    depends_on: [storage]
    environment:
      STORAGE_ENDPOINT: storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    networks: [data]

  # ---------- Почтовая заглушка (вместо внешнего почтового сервиса, B-10) ----------
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"     # веб-интерфейс с письмами
    networks: [data]

  # ---------- Заглушки внешних систем: финансовое подразделение (B-11), мониторинг (B-12) ----------
  external-stubs:
    build: ./external-stubs
    restart: unless-stopped
    environment:
      FINANCE_API_TOKEN: ${FINANCE_API_TOKEN}
      MONITORING_API_TOKEN: ${MONITORING_API_TOKEN}
    networks: [data]

  # ---------- Тестовые данные (одноразово, под суперпользователем БД) ----------
  db-seed:
    build: ./api
    command: ["python", "-m", "app.seed"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      SEED_PASSWORD: ${SEED_PASSWORD}
    networks: [data]

  # ---------- Backend API ----------
  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      db-seed: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      broker: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: app_api                     # не postgres!
      DB_PASSWORD: ${DB_API_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BROKER_HOST: broker
      BROKER_USER: ${RABBITMQ_USER}
      BROKER_PASSWORD: ${RABBITMQ_PASSWORD}
      STORAGE_ENDPOINT: storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      MONITORING_URL: http://external-stubs:8080/metrics
      MONITORING_API_TOKEN: ${MONITORING_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED}
      LOG_LEVEL: ${LOG_LEVEL}
      PUBLIC_BASE_URL: https://localhost:8443
    networks: [front, data]

  # ---------- Фоновый обработчик очередей ----------
  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      db-seed: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      broker: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: app_worker                  # своя роль, свои права
      DB_PASSWORD: ${DB_WORKER_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BROKER_HOST: broker
      BROKER_USER: ${RABBITMQ_USER}
      BROKER_PASSWORD: ${RABBITMQ_PASSWORD}
      STORAGE_ENDPOINT: storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      FINANCE_URL: http://external-stubs:8080/finance/reports
      FINANCE_API_TOKEN: ${FINANCE_API_TOKEN}
      PUBLIC_BASE_URL: https://localhost:8443
      LOG_LEVEL: ${LOG_LEVEL}
    networks: [data]

  # ---------- Клиентское приложение (nginx + собранный SPA, HTTPS) ----------
  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8443:443"
      - "8080:80"    # редирект на HTTPS
    networks: [front]

networks:
  front:
  data:

volumes:
  db-data:
  broker-data:
  storage-data:
